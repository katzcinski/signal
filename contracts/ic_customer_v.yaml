product: ic_customer_v
kind: internal_gate
dataset: ic_customer_v
owned_by: platform
owners:
- team-mdm
version: 1.0.0
lifecycle: active
description: 'Gate auf dem harmonisierten Kunden: Eindeutigkeit, Kundengruppe, Regionsabdeckung.'
enforcement_default: quarantine
quarantine:
  style: episodic
guarantees:
  schema:
    columns:
    - CUSTOMER_ID
    - CUSTOMER_NAME
    - COUNTRY_CODE
    - REGION_CODE
    - CITY
    - POSTAL_CODE
    - CUSTOMER_GROUP
    - CREATED_AT
    mode: closed
    severity: critical
    types:
      CUSTOMER_ID:
        type: string
        key: true
        nullable: false
      CUSTOMER_NAME:
        type: string
      COUNTRY_CODE:
        type: string
      REGION_CODE:
        type: string
      CITY:
        type: string
      POSTAL_CODE:
        type: string
      CUSTOMER_GROUP:
        type: string
      CREATED_AT:
        type: date
  keys:
  - columns:
    - CUSTOMER_ID
    unique: true
    severity: critical
  volume:
    min_rows: 8000
    severity: warn
    baseline: rolling
    bounds: auto
  completeness:
  - column: CUSTOMER_GROUP
    min_pct: 98.0
    severity: fail
  - column: REGION_CODE
    min_pct: 95.0
    severity: warn
  not_null:
  - columns:
    - CUSTOMER_ID
    - CUSTOMER_NAME
    severity: critical
checks:
- id: pattern_match
  params:
    <SPALTE>: COUNTRY_CODE
    <REGEX>: ^[A-Z]{2}$
  expect: = 0
  severity: warn
